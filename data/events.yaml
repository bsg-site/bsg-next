# Events calendar: conferences, schools and workshops run by other societies
# and facilities. BSG's own meetings live in content/meetings/ instead.
#
# Fields:
#   title       required
#   organiser   required, e.g. "ECA", "CCP4", "Diamond Light Source"
#   url         required, link to the host's page
#   start, end  dates as YYYY-MM-DD; leave start empty if not yet announced
#   when        free text shown when start is empty, e.g. "January 2027"
#   location    city and country, or "Online"
#   techniques  list of technique ids from data/techniques.yaml
#   description optional, one or two sentences
events:
- title: South West Structural Biology Consortium Conference 2026
  organiser: South West Structural Biology Consortium (SWSBC)
  url: https://events.cardiff.ac.uk/view/2026-south-west-structural-biology-consortium-conference/
  start: '2026-07-09'
  end: '2026-07-10'
  location: Cardiff, UK
  techniques:
  - crystallography
  - nmr
  - cryo-em
  - modelling-ai
  description: Annual meeting of structural biology groups from Exeter, Cardiff, Bath, Bristol, Reading, Portsmouth, Southampton, Sussex and UCL, covering crystallography, NMR and cryo-EM through to modelling and simulation. Held at Cardiff University's Centre for Student Life; main sponsor CCP4.
- title: CCP4 Northern Structural Biology Meeting 2026
  organiser: CCP4 and Newcastle University
  url: https://nusbf.ncl.ac.uk/ccp4-northern-Meeting-2026/
  start: '2026-11-11'
  end: '2026-11-13'
  location: Newcastle upon Tyne, UK
  techniques:
  - crystallography
  - cryo-em
  description: Free three-day meeting that particularly welcomes early-career researchers and students, with talk and poster prizes. Keynote speaker Professor Laura Spagnolo (University of Glasgow). Abstracts by 18 October, registration by 30 October; student travel bursaries available.
- title: Integrative Structural Biology Conference 2026
  organiser: DRIIMB (Digital Research Infrastructure for Integrative Molecular Biology)
  url: https://driimb.org/integrative-structural-biology-conference/
  start: '2026-10-12'
  end: '2026-10-14'
  location: Leeds, UK
  techniques:
  - cryo-em
  - crystallography
  - modelling-ai
  description: The first DRIIMB conference, on data, software and models for integrative structural biology, with panel discussions and poster sessions with flash talks. Listed by CCP-EM.
- title: Icknield Model Building Workshop 2026
  organiser: CCP-EM
  url: https://web.cvent.com/event/5e95d377-c35c-40ce-be7c-1f6866d5ac7c/summary
  start: '2026-11-09'
  end: '2026-11-13'
  location: Rutherford Appleton Laboratory and Diamond Light Source, Harwell, UK
  techniques:
  - cryo-em
  description: Five-day in-person course for structural biologists with their own cryo-EM maps, from map optimisation and automated model building to refinement, validation and deposition. Limited to 20 places; applications for 2026 closed on 26 August.
- title: 'Webinar: Lipid interactions driving actinoporin pore architecture and stoichiometry'
  organiser: Biochemical Society
  url: https://www.biochemistry.org/events-and-training/events-calendar/lipid-interactions-driving-actinoporin-pore-architecture-and-stoichiometry/
  start: '2026-11-04'
  location: Online
  techniques:
  - biophysics
  description: One-hour webinar, 14:00–15:00 UK time. Dr Gašper Šolinc (National Institute of Chemistry, Ljubljana) presents recent findings on the pore-forming, actinoporin-like protein Fav from the coral Orbicella faveolata. Register through the Biochemical Society page.
- title: 'Webinar: Co-folding methods for fragment-based drug discovery'
  organiser: CCPBioSim
  url: https://www.ccpbiosim.org/events/upcoming-events/astex2026
  start: '2026-11-18'
  location: Online
  techniques:
  - drug-design
  - modelling-ai
  description: 'CCPBioSim industry talk, 14:00–15:30 UK time, on Zoom. Marcel Verdonk (Astex) benchmarks deep-learning co-folding methods against industry baselines on Astex''s in-house fragment-based drug discovery data, from finding fragment binding sites to predicting binding modes and ligand-induced conformational changes. Free; register through the CCPBioSim page.'
- title: 'Webinar: What books inspire you?'
  organiser: British Biophysical Society
  url: https://docs.google.com/forms/d/e/1FAIpQLSdtMwc_3tj71B2z2MtnMmZvIQbjsWZoDnzKqpzD4ChiwnEAhA/viewform
  start: '2026-11-24'
  location: Online
  techniques:
  - biophysics
  - other
  description: A British Biophysical Society community engagement webinar at 12:00 UK time. Syma Khalid, Elspeth Garman and Aakash Basu share the books that shaped their careers in biophysics, from scientific classics to popular science, with a community book swap. Free and open to everyone; register through the form to receive the meeting link.
- title: Building Molecular Systems for MD
  organiser: CCPBioSim
  url: https://www.ccpbiosim.org/events/upcoming-events/prep2026
  start: '2026-11-26'
  end: '2026-11-27'
  location: Stopford Building, University of Manchester, Manchester, UK
  techniques:
  - modelling-ai
  description: Two-day hands-on workshop on preparing biomolecular systems for molecular dynamics, from placing proteins in lipid bilayers and preparing structures (including fitting to cryo-EM maps) to peptide fibrils and DNA. No prior experience needed; bring a laptop. Limited to 25 places, £25 including lunches; register by 19 November 2026.
- title: 'Webinar: Biochemistry beyond academia, from small biotechs to big pharma'
  organiser: Biochemical Society
  url: https://www.biochemistry.org/events-and-training/events-calendar/biochemistry-beyond-academia-from-small-biotechs-to-big-pharma/
  start: '2026-11-25'
  location: Online
  techniques:
  - drug-design
  - other
  description: One-hour careers webinar, 14:00–15:00 UK time, on moving from academia into biotech and pharma, with practical advice on applications and development opportunities. Useful for PhD students and postdocs weighing up industry. Register through the Biochemical Society page.
- title: 'Early Career Symposium 2026: Industry Transition Toolkit'
  organiser: Biochemical Society
  url: https://www.biochemistry.org/events-and-training/events-calendar/early-career-symposium-2026-industry-transition-toolkit/
  start: '2026-11-09'
  location: UK
  techniques:
  - other
  description: The Biochemical Society's annual one-day symposium for early-career researchers, this year on moving from academia into industry, recognising the transferable skills you already have and how to present them. Free for Biochemical Society members.
- title: Engineering Recombinant Proteins 2026
  organiser: Biochemical Society
  url: https://www.biochemistry.org/events-and-training/events-calendar/engineering-recombinant-proteins-2026/
  start: '2026-11-24'
  end: '2026-11-25'
  location: UK
  techniques:
  - biophysics
  - other
  description: Two-day hands-on training on producing pure, homogeneous, high-quality recombinant proteins for structural and functional studies, from bioinformatic construct design to expression, purification, stability and quality control with biophysical techniques.
- title: Advances in Fragment Screening & Structure-Based Drug Discovery
  organiser: EMBL, ESRF and Instruct-ERIC (Fragment-Screen project)
  url: https://instruct-eric.org/events/advances-in-fragment-screening--structure-based-drug-discovery-january-28th-and-29th-2027/
  start: '2027-01-28'
  end: '2027-01-29'
  location: EPN Campus, Grenoble, France
  techniques:
  - crystallography
  - nmr
  - cryo-em
  - drug-design
  description: Two-day meeting for academia, industry and fragment-screening facilities on X-ray and NMR fragment screening, AI and cryo-EM in drug design, and access to academic facilities. Posters welcome, with some chosen for talks. Register by 26 November 2026; PhD students who submit an abstract can apply for campus guesthouse rooms.
- title: 'EMBO Workshop: In situ structural biology'
  organiser: EMBO and EMBL
  url: https://www.embl.org/about/info/course-and-conference-office/events/iss27-01/
  start: '2027-02-09'
  end: '2027-02-12'
  location: EMBL Heidelberg, Germany, and online
  techniques:
  - cryo-em
  - imaging
  - mass-spec
  - modelling-ai
  description: 'Bridging molecular mechanisms with system-wide approaches: cryo-electron tomography, fluorescence microscopy, mass spectrometry and modelling of complexes in cells and tissues. Abstracts (on-site only) by 10 November 2026, on-site registration by 5 January 2027, virtual by 2 February 2027. EMBO travel, childcare and accessibility grants are available.'
- title: Biophysical Society 71st Annual Meeting (BPS2027)
  organiser: Biophysical Society
  url: https://www.biophysics.org/2027meeting
  start: '2027-02-20'
  end: '2027-02-24'
  location: Philadelphia, USA
  techniques:
  - biophysics
  - cryo-em
  - modelling-ai
  description: The Biophysical Society's annual meeting, one of the largest biophysics conferences, with strong structural biology, cryo-EM and simulation sessions. The regular abstract deadline has passed; late abstracts (with a handling fee) and early-bird registration close on 5 January 2027.
- title: ISCB UK 2027
  organiser: International Society for Computational Biology
  url: https://www.iscb.org/uk2027/home
  start: '2027-04-20'
  end: '2027-04-22'
  location: Glasgow, UK
  techniques:
  - modelling-ai
  description: Computational biology conference with a structural, molecular and systems biology theme.
- title: CCP-EM Spring Symposium 2027
  organiser: CCP-EM
  url: https://www.ccpem.ac.uk/symposium/
  start: '2027-04-21'
  end: '2027-04-23'
  location: Nottingham, UK and online
  techniques:
  - cryo-em
  description: The UK's annual cryo-EM methods symposium. Registration opens January 2027.
- title: '97th Harden Conference: Protein Kinases and Pseudokinases'
  organiser: Biochemical Society
  url: https://www.biochemistry.org/events-and-training/events-calendar/97th-harden-conference-protein-kinases-and-pseudokinases-the-next-generation/
  start: '2027-05-24'
  end: '2027-05-27'
  location: Liverpool, UK
  techniques:
  - drug-design
  - biophysics
  - crystallography
  description: The Biochemical Society's conference on the next generation of kinase and pseudokinase research, from signalling mechanisms, enzymology and structural biology to chemical biology, drug discovery and translational science. Keynotes, talks chosen for early-career researchers, and poster sessions. Venue and registration to be announced; you can register your interest for alerts.
- title: 'Gordon Research Conference: Three Dimensional Electron Microscopy'
  organiser: Gordon Research Conferences
  url: https://www.grc.org/three-dimensional-electron-microscopy-conference/2027/
  start: '2027-06-20'
  end: '2027-06-25'
  location: Newry, Maine, USA
  techniques:
  - cryo-em
- title: 51st FEBS Congress 2027
  organiser: Federation of European Biochemical Societies
  url: https://febscongress.org/registration/
  start: '2027-07-03'
  end: '2027-07-07'
  location: Riga, Latvia
  techniques:
  - biophysics
  description: Europe's largest biochemistry and molecular biology congress, preceded by the FEBS Young Scientists' Forum (1–3 July) for PhD students and postdocs. Abstract submission opened at the end of October 2026. Key deadlines are YSF applications by 9 December 2026, the Sprinzl and Neighbours support schemes by 11 January 2027, abstracts and FEBS bursaries by 1 March 2027 and early-bird registration by 3 March. The reduced Young Scientist rate is for those aged up to 35.
- title: The Protein Society 41st Annual Symposium
  organiser: The Protein Society
  url: https://www.proteinsociety.org/meetings
  start: '2027-07-09'
  end: '2027-07-12'
  location: San Francisco, USA
  techniques:
  - biophysics
  - crystallography
  - cryo-em
  - nmr
- title: 'Protons in Biology: Basic Science to Biomedicine (BPS Conference)'
  organiser: Biophysical Society
  url: https://www.biophysics.org/meetings-events/bps-conferences/2027-protons-in-biology-bps-conference
  start: '2027-08-01'
  end: '2027-08-04'
  location: Keble College, University of Oxford, UK
  techniques:
  - biophysics
  - cryo-em
  - nmr
  - modelling-ai
  description: A Biophysical Society conference in Oxford on the roles of protons in biology, from basic science to biomedicine, bringing together structural biology, simulation and physiology. Speakers include Judy Hirst, David Drew, Aashish Manglik, Mei Hong, Philip Biggin, Ville Kaila, Sharon Hammes-Schiffer and Pawel Swietach. Registration includes meals and, for those travelling, four nights in college. Abstracts by 5 April 2027 and early-bird registration by 26 April 2027.
- title: 12th European Crystallography School (ECS12)
  organiser: European Crystallographic Association (ECA)
  url: https://www.ccp4.ac.uk/schools/ECS12/
  start: '2027-07-21'
  end: '2027-07-27'
  location: Oxford, UK
  techniques:
  - crystallography
  description: The ECA's European Crystallography School comes to Oxford in 2027. The programme and application details are not yet published; check the school website.
- title: 'Molecular Biophysics of Membranes (BPS Conference)'
  organiser: Biophysical Society
  url: https://www.biophysics.org/meetings-events/bps-conferences/2027-molecular-biophysics-of-membranes-bps-conference
  start: '2027-08-08'
  end: '2027-08-11'
  location: Keble College, Oxford, UK
  techniques:
  - biophysics
  - modelling-ai
  description: A Biophysical Society conference on membrane biophysics, organised by Francisco Barrera, Syma Khalid and Peter Tieleman. Speakers include Phil Biggin, Luke Clifton, Joanne Parker, Sheena Radford, Susan Lea, Simon Scheuring and Gregory Voth. Abstracts by 19 April 2027.
- title: 36th European Crystallographic Meeting (ECM36)
  organiser: European Crystallographic Association
  url: http://www.xray.cz/ecm36/
  start: 2027-08-23
  end: 2027-08-28
  location: Prague, Czech Republic
  techniques:
  - crystallography
  description: The European crystallography meeting, covering structural biology among all areas of crystallography. Free pre-registration is available on the meeting website; abstracts and paid registration open in November 2026. Key deadlines are bursary applications by 31 March 2027, abstracts for talks by 15 April, early-bird registration by 31 May and poster abstracts by 15 June (see the meeting's deadlines page).
- title: Structural Bioinformatics 2027 (EMBL-EBI course)
  organiser: EMBL-EBI
  url: https://www.ebi.ac.uk/training/events/structural-bioinformatics-2027
  start: '2027-09-13'
  end: '2027-09-17'
  location: Online
  techniques:
  - modelling-ai
  description: EMBL-EBI's week-long online course for scientists who generate or use structural data; no prior structural bioinformatics experience needed. 35 places by application (2 March to 13 June 2027); fee £250 academic, £350 industry.
- title: 'EMBO Workshop: Computational structural biology'
  organiser: EMBO and EMBL
  url: https://www.embl.org/about/info/course-and-conference-office/events/csb27-01/
  start: '2027-10-26'
  end: '2027-10-29'
  location: EMBL Heidelberg, Germany, and online
  techniques:
  - modelling-ai
  - drug-design
  description: Integrative and all-atom modelling, nucleic acid–protein interactions, physics-based and machine-learned dynamics, biomolecular design and drug discovery. Includes short talks chosen from abstracts, posters and a job fair. Registration not yet open (register interest on the EMBL page).
- title: CCP4/DLS Data Collection and Structure Solution Workshop 2026
  organiser: CCP4 and Diamond Light Source
  url: https://www.ccp4.ac.uk/workshop/ccp4-workshop-2-2-2-2/
  start: '2026-11-24'
  end: '2026-12-01'
  location: Diamond Light Source, Harwell, UK
  techniques:
  - crystallography
  description: Hands-on course for graduate students, postdocs and early-career scientists, from data collection through phasing, refinement, validation and deposition, with a day collecting data on Diamond beamlines and time on your own project. The first two days are online, the rest in person. Places are limited and applications need a supervisor's recommendation.
- title: 'CCP4 Study Weekend 2027: Structural Biology on the Move'
  organiser: CCP4
  url: https://studyweekend.ccp4.ac.uk/
  start: '2027-01-06'
  end: '2027-01-08'
  location: East Midlands Conference Centre, Nottingham, UK
  techniques:
  - crystallography
  - cryo-em
  description: CCP4's annual study weekend, this year on time-resolved crystallography, metalloproteins, serial data processing and refinement. In person or online (free online), with the Diamond MX User Meeting on 6 January and a student poster session that evening. Registration is open; students registering by 15 November get free registration and one night's accommodation; in-person registration closes 6 December. Travel bursaries for students and young postdocs from non-UK labs (apply by 31 October).
- title: Lorne Conference on Protein Structure and Function 2027
  organiser: Lorne Proteins
  url: https://www.lorneproteins.org/
  when: February 2027
  location: Lorne, Australia
  techniques:
  - crystallography
  - cryo-em
  - biophysics
  description: Long-running international conference on protein structure and function.
- title: Physics of Life 2027
  organiser: Institute of Physics (IOP) with the British Biophysical Society and partners
  url: https://iop-physics-of-life-2027.eventsairsite.com/
  start: '2027-03-22'
  end: '2027-03-25'
  location: Edinburgh International Conference Centre, Edinburgh, UK
  techniques:
  - biophysics
  - imaging
  - modelling-ai
  description: "The third biennial UK conference on biological physics, organised by the Physics of Life Network, the IOP Biological Physics Group, the British Biophysical Society and partners. Parallel sessions of interest to structural biologists include Protein Structure, Dynamics and Interactions (speakers include Briony Yorke and Alice Pyne), Imaging and Single Molecule Biology, and Biomolecular Assemblies and Condensates. Registration opens in November 2026. Oral abstracts by 13 December 2026, poster abstracts by 22 January 2027, early-bird registration by 19 February 2027, registration closes 12 March 2027."
